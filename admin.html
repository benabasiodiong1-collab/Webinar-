<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin</title>
<style>
:root{--bg:#f4f1ea;--ink:#111;--card:#fff;--line:#ddd8cc;--acc:#0D6118;--mut:#5f6b60;--gold:#F5C400;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0b;--ink:#f5f2ea;--card:#161616;--line:#2a2a2a;--acc:#1a8a29;--mut:#a9b0a9}}
:root[data-theme="dark"]{--bg:#0b0b0b;--ink:#f5f2ea;--card:#161616;--line:#2a2a2a;--acc:#1a8a29;--mut:#a9b0a9}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:1.4rem;margin:0 0 10px}h2{font-size:1.05rem;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
label{display:block;font-size:.9rem;margin-bottom:10px}
input,textarea,button{font:inherit;border-radius:10px;padding:12px;width:100%}
input,textarea{border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-top:4px}
button{border:0;background:var(--acc);color:#fff;font-weight:700;cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.sm{width:auto;padding:4px 10px;font-size:.8rem}
.row{display:flex;gap:8px}.row>*{flex:1}
.meta{color:var(--mut);font-size:.9rem}.stat{font-size:1.8rem;font-weight:700}
.list{max-height:260px;overflow:auto;font-size:.9rem}
.list div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:6px 0;word-break:break-word}
.hidden{display:none}.err{color:#c0392b;min-height:1.2em}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>Admin dashboard</h1>

<section id="login" class="card">
  <label>Email<input id="em" type="email" autocomplete="username"></label>
  <label>Password<input id="pw" type="password" autocomplete="current-password"></label>
  <p class="err" id="lerr" role="alert"></p>
  <button id="go">Log in</button>
</section>

<section id="app" class="hidden">
  <div class="card"><span class="stat" id="count">0</span> <span class="meta">registered</span>
    <p class="meta" id="admwarn"></p></div>

  <div class="card">
    <h2>Live offer</h2>
    <label>Offer message<textarea id="offer_text" rows="3"></textarea></label>
    <div class="row">
      <label>Button label<input id="offer_button_label"></label>
      <label>Button link<input id="offer_url" placeholder="https://"></label>
    </div>
    <div class="row"><button id="showo">Show to everyone</button><button id="hideo" class="alt">Hide</button></div>
    <p class="meta" id="ostat"></p>
  </div>

  <div class="card">
    <h2>Webinar settings</h2>
    <label>Title<input id="title"></label>
    <label>Start date and time (your local time)<input id="start_at" type="datetime-local"></label>
    <label>Video link (YouTube Live link)<input id="video_url" placeholder="https://youtube.com/live/..."></label>
    <label>Telegram group link<input id="telegram_url"></label>
    <label><input type="checkbox" id="chat_enabled" style="width:auto;margin-right:8px">Chat on</label>
    <button id="save">Save settings</button>
    <p class="meta" id="sstat"></p>
  </div>

  <div class="card">
    <h2>Live chat</h2>
    <div class="list" id="chat"></div>
    <div class="row" style="margin-top:8px"><input id="hmsg" maxlength="200" placeholder="Post as Host" style="margin:0"><button id="hsend" style="flex:0 0 90px">Send</button></div>
  </div>

  <div class="card">
    <h2>Registrants</h2>
    <div class="list" id="regs"></div>
  </div>
  <button class="alt" id="out">Log out</button>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL="https://ttryrszrvuxwmlksxgip.supabase.co";
const SUPABASE_KEY="sb_publishable_2t8pOJ9kHMeSJiV8gSwAzw_1e9gq0zp";
const $=id=>document.getElementById(id);
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const F=['title','video_url','telegram_url','offer_text','offer_button_label','offer_url'];
const pad=n=>String(n).padStart(2,'0');
function toLocal(iso){const d=new Date(iso);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());}
function row(parent,text,btn){
  const r=document.createElement('div'),s=document.createElement('span');s.textContent=text;r.append(s);
  if(btn){const b=document.createElement('button');b.className='alt sm';b.textContent='Delete';b.onclick=btn;r.append(b);}
  parent.append(r);return r;
}
async function loadAll(){
  const {data:s,error}=await db.from('settings').select('*').eq('id',1).single();
  if(error||!s){return;}
  F.forEach(k=>$(k).value=s[k]||'');
  $('start_at').value=toLocal(s.start_at);$('chat_enabled').checked=s.chat_enabled;
  $('ostat').textContent=s.offer_visible?'Offer is showing to everyone.':'Offer is hidden.';
  const {data:r,error:e2}=await db.from('registrants').select('name,email,created_at').order('created_at',{ascending:false});
  $('admwarn').textContent=e2||!r?'':'';
  if(r){$('count').textContent=r.length;$('regs').textContent='';r.forEach(x=>row($('regs'),x.name+' · '+x.email));}
  if(!r||!r.length){if(await notAdmin())$('admwarn').textContent='Your email is not yet in the admins table, so registrants and edits are blocked.';}
  const {data:c}=await db.from('chat_messages').select('*').order('id',{ascending:false}).limit(60);
  $('chat').textContent='';(c||[]).forEach(m=>row($('chat'),m.name+': '+m.body,async()=>{await db.from('chat_messages').delete().eq('id',m.id);loadAll();}));
}
async function notAdmin(){
  const {data:u}=await db.auth.getUser();
  const {data}=await db.from('admins').select('email');
  return !(data&&data.length&&u&&u.user);
}
async function patch(o,el,msg){
  const {data,error}=await db.from('settings').update(o).eq('id',1).select();
  $(el).textContent=(error||!data||!data.length)?'Not saved. Check that your email is in the admins table.':msg;
  if(!error&&data&&data.length)loadAll();
}
function start(){$('login').classList.add('hidden');$('app').classList.remove('hidden');loadAll();
  db.channel('adm').on('postgres_changes',{event:'*',schema:'public',table:'chat_messages'},loadAll)
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'registrants'},loadAll).subscribe();}
$('go').onclick=async()=>{
  $('lerr').textContent='';
  const {error}=await db.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
  if(error)$('lerr').textContent='Login failed. Check your email and password.';else start();
};
$('out').onclick=async()=>{await db.auth.signOut();location.reload();};
$('showo').onclick=()=>patch({offer_text:$('offer_text').value,offer_button_label:$('offer_button_label').value,offer_url:$('offer_url').value,offer_visible:true},'ostat','Offer is showing to everyone.');
$('hideo').onclick=()=>patch({offer_visible:false},'ostat','Offer is hidden.');
$('save').onclick=()=>{
  const o={chat_enabled:$('chat_enabled').checked,start_at:new Date($('start_at').value).toISOString()};
  ['title','video_url','telegram_url'].forEach(k=>o[k]=$(k).value.trim());
  patch(o,'sstat','Saved.');
};
$('hsend').onclick=async()=>{const b=$('hmsg').value.trim();if(!b)return;$('hmsg').value='';await db.from('chat_messages').insert({name:'Host',body:b,is_host:true});};
db.auth.getSession().then(({data})=>{if(data.session)start();});
</script>
</body>
</html>
