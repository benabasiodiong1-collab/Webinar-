<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin</title>
<style>
:root{--bg:#f4f1ea;--ink:#111;--card:#fff;--line:#ddd8cc;--acc:#0D6118;--mut:#5f6b60;--gold:#F5C400;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0b;--ink:#f5f2ea;--card:#161616;--line:#2a2a2a;--acc:#1a8a29;--mut:#a9b0a9}}
:root[data-theme="dark"]{--bg:#0b0b0b;--ink:#f5f2ea;--card:#161616;--line:#2a2a2a;--acc:#1a8a29;--mut:#a9b0a9}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:1.4rem;margin:0 0 10px}h2{font-size:1.05rem;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
label{display:block;font-size:.9rem;margin-bottom:10px}
input,textarea,button,select{font:inherit;border-radius:10px;padding:12px;width:100%}
input,textarea,select{margin-top:4px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-top:4px}
button{border:0;background:var(--acc);color:#fff;font-weight:700;cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.sm{width:auto;padding:4px 10px;font-size:.8rem}
.row{display:flex;gap:8px}.row>*{flex:1}
.meta{color:var(--mut);font-size:.9rem}.stat{font-size:1.8rem;font-weight:700}
.list{max-height:260px;overflow:auto;font-size:.9rem}
.list div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:6px 0;word-break:break-word}
.hidden{display:none}.err{color:#c0392b;min-height:1.2em}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>Admin dashboard</h1>

<section id="login" class="card">
  <label>Email<input id="em" type="email" autocomplete="username"></label>
  <label>Password<input id="pw" type="password" autocomplete="current-password"></label>
  <p class="err" id="lerr" role="alert"></p>
  <button id="go">Log in</button>
</section>

<section id="app" class="hidden">
  <div class="card"><span class="stat" id="count">0</span> <span class="meta">registered</span>
    <p class="meta" id="admwarn"></p></div>

  <div class="card">
    <h2>Live offer</h2>
    <label>Offer message<textarea id="offer_text" rows="3"></textarea></label>
    <div class="row">
      <label>Button label<input id="offer_button_label"></label>
      <label>Button link<input id="offer_url" placeholder="https://"></label>
    </div>
    <div class="row">
      <label>Auto-show after (minutes, 0 = manual)<input id="offer_delay_minutes" type="number" min="0" value="0"></label>
      <label>Count from<select id="offer_delay_mode"><option value="start">Webinar start</option><option value="join">When each person enters</option></select></label>
    </div>
    <button id="saveo" style="margin-bottom:8px">Save offer &amp; timing</button>
    <div class="row"><button id="showo">Show to everyone</button><button id="hideo" class="alt">Hide</button></div>
    <p class="meta" id="ostat"></p>
  </div>

  <div class="card">
    <h2>Webinar settings</h2>
    <label>Title<input id="title"></label>
    <label>Start date and time (your local time)<input id="start_at" type="datetime-local"></label>
    <label>Video link (YouTube Live link)<input id="video_url" placeholder="https://youtube.com/live/..."></label>
    <label>Telegram group link<input id="telegram_url"></label>
    <label><input type="checkbox" id="chat_enabled" style="width:auto;margin-right:8px">Chat on</label>
    <button id="save">Save settings</button>
    <p class="meta" id="sstat"></p>
  </div>

  <div class="card">
    <h2>Emails</h2>
    <p class="meta">Edit any email below. You can use {{name}}, {{title}}, {{time}}, {{link}} and {{telegram}}, and they fill in automatically.</p>
    <div id="emails"></div>
  </div>

  <div class="card">
    <h2>Live chat</h2>
    <div class="list" id="chat"></div>
    <div class="row" style="margin-top:8px"><input id="hmsg" maxlength="200" placeholder="Post as Host" style="margin:0"><button id="hsend" style="flex:0 0 90px">Send</button></div>
  </div>

    <div class="card">
    <h2>Registrants</h2>
    <div class="list" id="regs"></div>
  </div>
  <button class="alt" id="out">Log out</button>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL="https://ttryrszrvuxwmlksxgip.supabase.co";
const SUPABASE_KEY="sb_publishable_2t8pOJ9kHMeSJiV8gSwAzw_1e9gq0zp";
const $=id=>document.getElementById(id);
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const F=['title','video_url','telegram_url','offer_text','offer_button_label','offer_url'];
const pad=n=>String(n).padStart(2,'0');
function toLocal(iso){const d=new Date(iso);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());}
function row(parent,text,btn){
  const r=document.createElement('div'),s=document.createElement('span');s.textContent=text;r.append(s);
  if(btn){const b=document.createElement('button');b.className='alt sm';b.textContent='Delete';b.onclick=btn;r.append(b);}
  parent.append(r);return r;
}
async function loadAll(){
  const {data:s,error}=await db.from('settings').select('*').eq('id',1).single();
  if(error||!s){return;}
  F.forEach(k=>$(k).value=s[k]||'');
  $('offer_delay_minutes').value=s.offer_delay_minutes||0;$('offer_delay_mode').value=s.offer_delay_mode||'start';
  $('start_at').value=toLocal(s.start_at);$('chat_enabled').checked=s.chat_enabled;
  $('ostat').textContent=s.offer_visible?'Offer is showing to everyone.':'Offer is hidden.';
  const {data:r,error:e2}=await db.from('registrants').select('name,email,created_at').order('created_at',{ascending:false});
  $('admwarn').textContent=e2||!r?'':'';
  if(r){$('count').textContent=r.length;$('regs').textContent='';r.forEach(x=>row($('regs'),x.name+' · '+x.email));}
  if(!r||!r.length){if(await notAdmin())$('admwarn').textContent='Your email is not yet in the admins table, so registrants and edits are blocked.';}
  const {data:c}=await db.from('chat_messages').select('*').order('id',{ascending:false}).limit(60);
  $('chat').textContent='';(c||[]).forEach(m=>row($('chat'),m.name+': '+m.body,async()=>{await db.from('chat_messages').delete().eq('id',m.id);loadAll();}));
}
async function notAdmin(){
  const {data:u}=await db.auth.getUser();
  const {data}=await db.from('admins').select('email');
  return !(data&&data.length&&u&&u.user);
}
async function patch(o,el,msg){
  const {data,error}=await db.from('settings').update(o).eq('id',1).select();
  $(el).textContent=error?'Not saved: '+error.message:(!data||!data.length)?'Not saved: your email is not in the admins table.':msg;
  if(!error&&data&&data.length)loadAll();
}
const UNIT={minutes:1,hours:60,days:1440};
const el=(t,p,k)=>{const e=Object.assign(document.createElement(t),p||{});if(k)e.append(...k);return e;};
const cap=x=>el('div',{className:'meta',textContent:x});
const sel=(opts,val)=>{const s=el('select');for(const [v,l] of opts)s.append(el('option',{value:v,textContent:l}));s.value=val;return s;};
async function loadEmails(){
  const {data,error:le}=await db.from('email_templates').select('*');
  const box=$('emails');box.textContent='';
  if(le){box.append(el('p',{className:'err',textContent:'Could not load emails: '+le.message}));return;}
  if(!data||!data.length)box.append(el('p',{className:'err',textContent:'No emails found. The email table may be empty or missing in Supabase.'}));
  const list=(data||[]).sort((a,b)=>(a.offset_minutes??-1e9)-(b.offset_minutes??-1e9));
  list.forEach(t=>{
    const w=el('div');w.style.cssText='border-top:1px solid var(--line);padding-top:12px;margin-top:12px';
    const o=t.offset_minutes;
    const mode=o===null?'now':(o<0?'before':'after'),abs=Math.abs(o||0);
    let u='minutes';if(abs>0&&abs%1440===0)u='days';else if(abs>0&&abs%60===0)u='hours';
    const num=el('input',{type:'number',min:0,value:abs/UNIT[u]});
    const unit=sel([['minutes','minutes'],['hours','hours'],['days','days']],u);
    const when=sel([['now','Right after registering'],['before','Before the webinar starts'],['after','After the webinar starts']],mode);
    const aud=sel([['all','Everyone registered'],['attended','Only people who watched'],['missed','Only people who missed it']],t.audience);
    const label=el('input',{value:t.label}),sub=el('input',{value:t.subject}),body=el('textarea',{rows:8,value:t.body});
    const cb=el('input',{type:'checkbox',checked:t.enabled});cb.style.cssText='width:auto;margin-right:8px';
    const en=el('label',{},[cb,'Send this email']);
    const st=el('p',{className:'meta'});
    const timing=el('div',{className:'row'},[num,unit]);
    const sync=()=>{timing.style.display=when.value==='now'?'none':'flex';};when.onchange=sync;sync();
    const save=el('button',{textContent:'Save this email'});
    save.onclick=async()=>{
      const n=Math.max(0,parseInt(num.value,10)||0)*UNIT[unit.value];
      const off=when.value==='now'?null:(when.value==='before'?-n:n);
      const {data:r,error}=await db.from('email_templates').update({label:label.value,subject:sub.value,body:body.value,offset_minutes:off,audience:aud.value,enabled:cb.checked}).eq('kind',t.kind).select();
      st.textContent=(error||!r||!r.length)?'Not saved.':'Saved.';
    };
    const del=el('button',{className:'alt',textContent:'Delete'});
    del.onclick=async()=>{if(!confirm('Delete this email?'))return;await db.from('email_templates').delete().eq('kind',t.kind);loadEmails();};
    w.append(cap('Name (only you see this)'),label,cap('When to send'),when,timing,cap('Who gets it'),aud,cap('Subject'),sub,cap('Message'),body,en,el('div',{className:'row'},[save,del]),st);
    box.append(w);
  });
  const add=el('button',{textContent:'+ Add a new email',className:'alt'});add.style.marginTop='14px';
  add.onclick=async()=>{const {error:ae}=await db.from('email_templates').insert({kind:'custom_'+Date.now(),label:'New email',subject:'Subject here',body:'Hi {{name}},\n\n',offset_minutes:180,audience:'all',sort:100});if(ae){alert('Could not add: '+ae.message);return;}loadEmails();};
  box.append(add);
}
function start(){$('login').classList.add('hidden');$('app').classList.remove('hidden');loadAll();loadEmails();
  db.channel('adm').on('postgres_changes',{event:'*',schema:'public',table:'chat_messages'},loadAll)
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'registrants'},loadAll).subscribe();}
$('go').onclick=async()=>{
  $('lerr').textContent='';
  const {error}=await db.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
  if(error)$('lerr').textContent='Login failed. Check your email and password.';else start();
};
$('out').onclick=async()=>{await db.auth.signOut();location.reload();};
const oF=()=>({offer_text:$('offer_text').value,offer_button_label:$('offer_button_label').value,offer_url:$('offer_url').value,offer_delay_minutes:Math.max(0,parseInt($('offer_delay_minutes').value)||0),offer_delay_mode:$('offer_delay_mode').value});
$('saveo').onclick=()=>patch(oF(),'ostat','Offer and timing saved.');
$('showo').onclick=()=>patch({...oF(),offer_visible:true},'ostat','Offer is showing to everyone.');
$('hideo').onclick=()=>patch({offer_visible:false},'ostat','Offer is hidden.');
$('save').onclick=()=>{
  const o={chat_enabled:$('chat_enabled').checked,start_at:new Date($('start_at').value).toISOString()};
  ['title','video_url','telegram_url'].forEach(k=>o[k]=$(k).value.trim());
  patch(o,'sstat','Saved.');
};
$('hsend').onclick=async()=>{const b=$('hmsg').value.trim();if(!b)return;$('hmsg').value='';await db.from('chat_messages').insert({name:'Host',body:b,is_host:true});};
db.auth.getSession().then(({data})=>{if(data.session)start();});
</script>
</body>
</html>
